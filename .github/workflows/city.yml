name: Update GitHub City

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Take screenshot
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 900, height: 500 });
            await page.goto('https://github-city-abdullahs-projects-c1b83a09.vercel.app/?user=abdullahsaleem786', { waitUntil: 'networkidle2', timeout: 30000 });
            await new Promise(r => setTimeout(r, 4000));
            await page.screenshot({ path: 'city.png', clip: { x: 0, y: 0, width: 900, height: 500 } });
            await browser.close();
          })();
          "

      - name: Commit city image
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add city.png
          git commit -m "🏙️ Update city snapshot" || echo "No changes"
          git push
